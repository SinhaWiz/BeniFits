name: benifits-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: benifits
      POSTGRES_PASSWORD: benifits
      POSTGRES_DB: benifits
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U benifits']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - server/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://benifits:benifits@postgres:5432/benifits?schema=public
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '4879'

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      - server

volumes:
  postgres_data:
